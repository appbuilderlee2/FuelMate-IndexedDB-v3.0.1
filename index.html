<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f766e">
    <script>
        (() => {
            let appearance = 'apple-fluid-system';
            try { appearance = localStorage.getItem('fuelmate_appearance') || appearance; } catch (_) {}
            if (!['apple-fluid-light', 'apple-fluid-dark', 'apple-fluid-system', 'ios-native-light', 'ios-native-dark', 'ios-native-system', 'ios-glass-light', 'ios-glass-dark', 'ios-glass-system'].includes(appearance)) appearance = 'apple-fluid-system';
            const dark = appearance.endsWith('-dark') || (appearance.endsWith('-system') && matchMedia('(prefers-color-scheme: dark)').matches);
            try { document.documentElement.dataset.reduceTransparency = localStorage.getItem('fuelmate_reduce_transparency') === 'true' ? 'true' : 'false'; } catch (_) {}
            document.documentElement.dataset.appearance = appearance;
            document.documentElement.dataset.colorScheme = dark ? 'dark' : 'light';
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon-192.png" type="image/png">
    <title>FuelMate</title>
    <link rel="preload" href="./material-icons/material-icons.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./material-icons/material-icons.css">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-heading: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }
        :root[data-color-scheme="dark"] {
                --bg-main: #0f172a;
                --bg-card: #1e293b;
                --text-heading: #f1f5f9;
                --text-sub: #94a3b8;
                --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-heading);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(100px + var(--safe-bottom));
            overscroll-behavior-y: none; 
        }
        .pt-safe { padding-top: calc(var(--safe-top) + 20px); } 
        .period-filter { width: 100%; min-width: 0; }
        .period-modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; }
        .period-modes:has(.period-mode:nth-child(3):last-child) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .period-mode { min-width: 0; min-height: 36px; padding: 7px 3px; border-radius: 11px; font-size: 12px; font-weight: 650; white-space: nowrap; }
        .period-field { display: flex; flex-direction: column; min-width: 0; gap: 5px; font-size: 12px; font-weight: 650; }
        .period-filter > .period-field, .period-range { margin-top: 11px; }
        .period-field > span { color: #64748b; }
        .period-filter-on-color .period-field > span { color: rgba(255,255,255,.9); }
        .period-input { display: block; width: 100%; min-width: 0; max-width: 100%; height: 44px; padding: 8px 12px; border-radius: 12px; font-size: 16px; text-align: left; outline: none; box-sizing: border-box; color-scheme: light; }
        :root[data-color-scheme="dark"] .period-input { color-scheme: dark; }
        .period-input::-webkit-date-and-time-value { min-width: 0; text-align: left; }
        .period-range { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
        .period-clear { justify-self: start; color: #0c8e97; font-size: 12px; font-weight: 700; padding: 5px 0; }
        @media (min-width: 520px) { .period-range { grid-template-columns: repeat(2, minmax(0, 1fr)); } .period-clear { grid-column: 1 / -1; } }
        .pb-safe { padding-bottom: calc(100px + var(--safe-bottom)); }
        .nav-safe { padding-bottom: calc(var(--safe-bottom) + 12px); }
        
        /* Dynamic Gradients based on Car Color */
        .grad-teal { background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%); }
        .grad-blue { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .grad-red { background: linear-gradient(135deg, #991b1b 0%, #ef4444 100%); }
        .grad-black { background: linear-gradient(135deg, #000000 0%, #374151 100%); }
        .grad-white { background: linear-gradient(135deg, #94a3b8 0%, #cbd5e1 100%); color: #0f172a; }
        .grad-yellow { background: linear-gradient(135deg, #ca8a04 0%, #eab308 100%); }
        .grad-purple { background: linear-gradient(135deg, #6b21a8 0%, #a855f7 100%); }
        .grad-green { background: linear-gradient(135deg, #166534 0%, #22c55e 100%); }
        .grad-orange { background: linear-gradient(135deg, #c2410c 0%, #f97316 100%); }
        .grad-brown { background: linear-gradient(135deg, #451a03 0%, #78350f 100%); }
        .grad-grey { background: linear-gradient(135deg, #374151 0%, #6b7280 100%); }
        .grad-pink { background: linear-gradient(135deg, #be185d 0%, #ec4899 100%); }
        .grad-cyan { background: linear-gradient(135deg, #0e7490 0%, #06b6d4 100%); }

        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        :root[data-appearance^="apple-fluid"] {
            --bg-main: #f4f8fb;
            --bg-card: rgba(255, 255, 255, 0.82);
            --text-heading: #101828;
            --text-sub: #667085;
            --border-color: rgba(148, 163, 184, 0.22);
            --fluid-field: rgba(255, 255, 255, 0.7);
            --fluid-opaque: #ffffff;
        }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] {
            --bg-main: #07111f;
            --bg-card: rgba(17, 30, 48, 0.82);
            --text-heading: #f7fafc;
            --text-sub: #9eacbd;
            --border-color: rgba(148, 163, 184, 0.2);
            --fluid-field: rgba(29, 45, 66, 0.8);
            --fluid-opaque: #142237;
        }
        :root[data-appearance^="apple-fluid"] body {
            background:
                radial-gradient(90% 45% at 5% 0%, rgba(45, 212, 191, 0.11), transparent 65%),
                radial-gradient(75% 40% at 100% 18%, rgba(56, 189, 248, 0.09), transparent 70%),
                var(--bg-main);
            font-optical-sizing: auto;
        }
        :root[data-appearance^="apple-fluid"] .material-icons {
            width: 1em;
            overflow: hidden;
            flex-shrink: 0;
        }
        :root[data-appearance^="apple-fluid"] .theme-bg-card,
        :root[data-appearance^="apple-fluid"] .card-shadow {
            background-color: var(--bg-card);
            backdrop-filter: blur(24px) saturate(145%);
            -webkit-backdrop-filter: blur(24px) saturate(145%);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(20, 47, 74, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .theme-bg-card,
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .card-shadow {
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        :root[data-appearance^="apple-fluid"] #modal-content {
            background: var(--bg-card);
            color: var(--text-heading);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            box-shadow: 0 -12px 40px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.65);
            padding-bottom: calc(24px + var(--safe-bottom));
        }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] #modal-content {
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        :root[data-appearance^="apple-fluid"] :is(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]), select, textarea) {
            background-color: var(--fluid-field);
            color: var(--text-heading);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            accent-color: #0d9488;
        }
        :root[data-appearance^="apple-fluid"] :is(input, select, textarea):focus-visible,
        :root[data-appearance^="apple-fluid"] :is(button, [role="button"]):focus-visible {
            outline: 2px solid #0d9488;
            outline-offset: 2px;
        }
        :root[data-appearance^="apple-fluid"] button,
        :root[data-appearance^="apple-fluid"] [role="button"] {
            touch-action: manipulation;
            transition: transform 100ms ease-out, opacity 160ms ease, background-color 180ms ease, box-shadow 180ms ease;
        }
        :root[data-appearance^="apple-fluid"] button:active,
        :root[data-appearance^="apple-fluid"] [role="button"]:active { transform: scale(0.97); }
        /* Dashboard concept: quiet vehicle-first layout, shared by light/dark/system. */
        :root[data-appearance^="apple-fluid"] .fluid-dashboard {
            --dash-surface: rgba(255, 255, 255, .88);
            --dash-ink: #172435;
            --dash-muted: #67778b;
            --dash-line: rgba(156, 182, 210, .22);
            --dash-tint: #e8f6f8;
            width: min(100%, 520px);
            margin: 0 auto;
            padding: calc(var(--safe-top) + 24px) 18px calc(124px + var(--safe-bottom));
            color: var(--dash-ink);
        }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-dashboard {
            --dash-surface: rgba(30, 43, 58, .84);
            --dash-ink: #f5f8fc;
            --dash-muted: #b2bece;
            --dash-line: rgba(183, 207, 228, .2);
            --dash-tint: #1c4c57;
        }
        .fluid-header { display: flex; align-items: center; justify-content: space-between; margin: 0 6px 18px; }
        .fluid-header h1 { font-size: 32px; line-height: 1.18; letter-spacing: -.9px; font-weight: 760; }
        .fluid-vehicle-list { display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: -3px 0 13px; padding: 3px 2px 5px; }
        .fluid-vehicle-list::-webkit-scrollbar { display: none; }
        .fluid-vehicle-option { flex: none; display: inline-flex; align-items: center; gap: 3px; max-width: 220px; min-height: 34px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 18px; color: var(--dash-muted); background: var(--dash-surface); border: 1px solid var(--dash-line); font-size: 12px; font-weight: 680; }
        .fluid-vehicle-option.is-active { background: #128d96; color: white; border-color: #128d96; }
        .fluid-vehicle-option > span:not(.material-icons) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .fluid-vehicle-add { color: #0d8b94; }
        .fluid-vehicle-add .material-icons { font-size: 16px; }
        .fluid-vehicle-switch {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 82px; height: 46px; border-radius: 24px;
            background: var(--dash-surface); border: 1px solid var(--dash-line);
            box-shadow: 0 5px 16px rgba(32, 75, 117, .06); color: var(--dash-ink);
        }
        .fluid-vehicle-switch .material-icons:first-child { font-size: 23px; }
        .fluid-vehicle-switch .material-icons:last-child { font-size: 19px; }
        .fluid-panel {
            background: var(--dash-surface); border: 1px solid var(--dash-line);
            border-radius: 22px; box-shadow: 0 8px 26px rgba(33, 69, 106, .045), inset 0 1px 0 rgba(255,255,255,.3);
            backdrop-filter: blur(20px) saturate(130%); -webkit-backdrop-filter: blur(20px) saturate(130%);
        }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-panel { box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 25px rgba(0,0,0,.11); }
        .fluid-hero { height: 196px; padding: 23px 14px 12px; position: relative; overflow: hidden; margin-bottom: 12px; }
        .fluid-hero-scenery {
            position: absolute; inset: 0 0 55px 0; pointer-events: none; opacity: .62;
            background: radial-gradient(ellipse 46% 36% at 90% 78%, rgba(160,195,229,.28), transparent 95%),
                radial-gradient(ellipse 30% 26% at 57% 75%, rgba(180,210,236,.25), transparent 95%),
                linear-gradient(150deg, transparent 48%, rgba(193,219,241,.16) 49%, transparent 62%);
        }
        .fluid-hero-content { position: relative; z-index: 2; margin-left: 7px; max-width: 45%; }
        .fluid-hero h2 { font-weight: 760; font-size: 26px; letter-spacing: -.5px; line-height: 1.12; overflow-wrap: anywhere; }
        .fluid-hero p { font-size: 16px; color: var(--dash-muted); line-height: 1.46; }
        .fluid-hero p:first-of-type { margin-top: 7px; }
        .fluid-car-image { position: absolute; width: 59%; height: auto; right: 2%; top: 22px; z-index: 1; object-fit: contain; pointer-events: none; }
        .fluid-car-image.is-suv { width: 56%; right: 1%; top: 23px; }
        .fluid-car-fallback { position: absolute; z-index: 1; right: 7%; top: 23px; width: 43%; height: 116px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #8db6bb; background: linear-gradient(145deg, rgba(196,226,234,.47), rgba(228,241,247,.15)); pointer-events: none; }
        .fluid-car-fallback .material-icons { font-size: 75px; }
        :root[data-color-scheme="dark"] .fluid-car-fallback { color: #79aeba; background: linear-gradient(145deg, rgba(93,136,152,.28), rgba(63,92,110,.1)); }
        .fluid-add-record {
            position: absolute; z-index: 3; bottom: 12px; left: 12px; right: 12px;
            height: 48px; border-radius: 16px; color: #fff; background: linear-gradient(120deg, #159ea8, #0d909b);
            display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 15px; font-weight: 680;
            box-shadow: 0 7px 16px rgba(16, 151, 157, .13);
        }
        .fluid-add-record .material-icons { font-size: 25px; }
        .fluid-metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-bottom: 12px; }
        .fluid-metric { position: relative; min-width: 0; height: 116px; text-align: left; padding: 12px; display: flex; align-items: flex-start; gap: 10px; color: var(--dash-ink); }
        .fluid-icon-box { flex: none; width: 44px; height: 44px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: #138f99; background: #e0f6f7; }
        .fluid-icon-box .material-icons { font-size: 23px; }
        .fluid-icon-box.is-blue { color: #287db1; background: #e1f2ff; }
        .fluid-icon-box.is-neutral { color: #506579; background: #edf3f8; }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-icon-box { color: #62d4dc; background: #1b515b; }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-icon-box.is-blue { color: #7bc5f2; background: #224760; }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-icon-box.is-neutral { color: #d3e0eb; background: #334453; }
        .fluid-metric-copy { min-width: 0; display: flex; flex-direction: column; padding-top: 2px; }
        .fluid-metric-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 104px; }
        .fluid-metric strong { font-size: 26px; line-height: 1; letter-spacing: -.7px; margin: 17px 0 3px; font-weight: 750; white-space: nowrap; }
        .fluid-metric small { color: var(--dash-muted); font-size: 12px; line-height: 1.1; white-space: nowrap; }
        .fluid-chevron { font-size: 20px; color: #97a9bb; flex: none; }
        .fluid-metric > .fluid-chevron { position: absolute; right: 9px; top: 14px; font-size: 16px; }
        .fluid-next { display: flex; position: relative; width: 100%; height: 102px; padding: 14px; text-align: left; gap: 12px; margin-bottom: 22px; align-items: center; color: var(--dash-ink); }
        .fluid-next-copy { min-width: 0; display: flex; flex-direction: column; flex: 1; }
        .fluid-next-copy small { color: var(--dash-muted); font-size: 12px; margin-bottom: 2px; }
        .fluid-next-copy strong { font-size: 15px; line-height: 1.25; font-weight: 720; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fluid-next-copy > span { color: var(--dash-muted); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fluid-due { align-self: flex-start; margin-top: 5px; color: #115c66; background: var(--dash-tint); border-radius: 14px; padding: 5px 8px; font-size: 11px; white-space: nowrap; }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .fluid-due { color: #bbf5f3; }
        .fluid-progress { display: block; width: min(100%, 184px); height: 5px; margin-top: 8px; border-radius: 6px; background: linear-gradient(90deg, #159da7 28%, #dce8f0 28%); }
        .fluid-next > .fluid-chevron { margin-left: auto; }
        .fluid-section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 0 6px 8px; }
        .fluid-section-heading h2 { font-size: 17px; font-weight: 730; letter-spacing: -.2px; }
        .fluid-section-heading button { color: #0578b8; font-size: 13px; }
        .fluid-recent { overflow: hidden; margin-bottom: 15px; padding: 0 13px; }
        .fluid-recent-row { display: flex; align-items: center; width: 100%; min-height: 66px; text-align: left; gap: 10px; color: var(--dash-ink); }
        .fluid-recent-row + .fluid-recent-row { border-top: 1px solid var(--dash-line); }
        .fluid-recent-row .fluid-icon-box { width: 40px; height: 40px; border-radius: 12px; }
        .fluid-recent-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .fluid-recent-copy strong { font-weight: 690; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fluid-recent-copy small { color: var(--dash-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fluid-recent-odo { font-size: 11px; color: var(--dash-muted); white-space: nowrap; }
        .fluid-empty { padding: 28px 6px; color: var(--dash-muted); text-align: center; font-size: 13px; }
        .fluid-details { margin: 18px 5px 0; font-size: 13px; }
        .fluid-details summary { display: flex; justify-content: space-between; color: var(--dash-muted); cursor: pointer; padding: 12px; list-style: none; }
        .fluid-details summary::-webkit-details-marker { display: none; }
        .fluid-details[open] summary .material-icons { transform: rotate(180deg); }
        .fluid-detail-content { background: var(--dash-surface); border: 1px solid var(--dash-line); border-radius: 20px; padding: 16px; }
        .fluid-detail-stats, .fluid-detail-actions { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 15px; }
        .fluid-detail-stats span { display: flex; flex-direction: column; color: var(--dash-muted); }
        .fluid-detail-stats strong { color: var(--dash-ink); }
        .fluid-detail-actions button, .fluid-tire-list button { border: 1px solid var(--dash-line); border-radius: 12px; padding: 9px; }
        .fluid-detail-content h3 { font-weight: 700; margin: 8px 0; }
        .fluid-tire-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .fluid-tire-list button { display: flex; flex-direction: column; text-align: left; }
        .fluid-all-reminders { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: #07818a; font-weight: 680; }
        .fluid-reminder-center { margin: 26px 5px 0; }
        .fluid-reminder-row { display: flex; align-items: center; padding: 12px; gap: 10px; margin-top: 9px; }
        .fluid-reminder-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .fluid-reminder-copy strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fluid-reminder-copy small { font-size: 11px; color: var(--dash-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fluid-reminder-row > button { font-size: 11px; font-weight: 680; color: #08838c; padding: 8px; border: 1px solid var(--dash-line); border-radius: 12px; white-space: nowrap; }
        @media (max-width: 390px) {
            .fluid-dashboard { padding-left: 13px !important; padding-right: 13px !important; }
            .fluid-header { margin-bottom: 13px; }
            .fluid-hero { height: 177px; padding-top: 18px; }
            .fluid-hero h2 { font-size: 23px; }
            .fluid-car-image { width: 57%; top: 22px; }
            .fluid-metric { gap: 7px; padding: 10px; height: 105px; }
            .fluid-metric .fluid-icon-box { width: 37px; height: 37px; }
            .fluid-metric-title { max-width: 87px; font-size: 11px; }
            .fluid-metric strong { font-size: 23px; }
            .fluid-next { height: 92px; margin-bottom: 16px; }
            .fluid-recent-odo { display: none; }
            .fluid-due { max-width: 82px; overflow: hidden; text-overflow: ellipsis; }
        }
        @media (prefers-reduced-transparency: reduce) {
            :root[data-appearance^="apple-fluid"] .fluid-panel { background: var(--fluid-opaque); backdrop-filter: none; -webkit-backdrop-filter: none; }
        }
        :root[data-appearance^="apple-fluid"][data-reduce-transparency="true"] .fluid-panel { background: var(--fluid-opaque); backdrop-filter: none; -webkit-backdrop-filter: none; }
        .appearance-preview { box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.28), 0 5px 14px rgba(15, 23, 42, 0.08); }
        .appearance-option[aria-checked="true"] { background: rgba(20, 184, 166, 0.1); box-shadow: inset 0 0 0 1px rgba(13, 148, 136, 0.22); }
        .glass-nav { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border-top: 1px solid var(--border-color);
        }
        :root[data-color-scheme="dark"] .glass-nav { background: rgba(30, 41, 59, 0.9); border-top: 1px solid #334155; }
        .liquid-nav {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(18px) saturate(1.4);
            box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.12);
        }
        .liquid-nav-bg {
            position: absolute;
            inset: -40px;
            background:
                radial-gradient(120px 80px at 10% 20%, rgba(20, 184, 166, 0.35), transparent 60%),
                radial-gradient(140px 90px at 90% 30%, rgba(59, 130, 246, 0.25), transparent 60%),
                radial-gradient(180px 120px at 50% 120%, rgba(16, 185, 129, 0.25), transparent 70%);
            filter: blur(6px);
            animation: liquid-drift 8s ease-in-out infinite alternate, liquid-float 12s ease-in-out infinite;
            pointer-events: none;
        }
        .liquid-nav-gloss {
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.35) 70%);

            animation: liquid-shimmer 6s ease-in-out infinite;
            pointer-events: none;

            position: absolute;
            left: 0;
            top: 50%;
            height: 62px;

            transform: translate3d(calc(var(--active-index) * 100%), -50%, 0);

            z-index: 0;

            padding: 4px;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            background: rgba(250, 253, 255, 0.78);

            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);

        :root[data-appearance^="apple-fluid"] .liquid-nav-bg { opacity: 0.3; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-gloss { opacity: 0.3; }
        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .liquid-nav {
            background: rgba(15, 29, 47, 0.78);
            border-color: rgba(181, 205, 224, 0.2);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);

        :root[data-appearance^="apple-fluid"][data-color-scheme="dark"] .liquid-nav-item.is-active { color: #7be5d5; }

            background: rgba(64, 178, 167, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        @keyframes liquid-drift {
            0% { transform: translate3d(-4%, -2%, 0) scale(1); }
            100% { transform: translate3d(4%, 2%, 0) scale(1.05); }
        }
        @keyframes liquid-float {
            0% { filter: blur(6px); }
            50% { filter: blur(10px); }
            100% { filter: blur(6px); }
        }
        @keyframes liquid-shimmer {
            0% { transform: translateX(-15%); opacity: 0.35; }
            50% { transform: translateX(10%); opacity: 0.55; }
            100% { transform: translateX(20%); opacity: 0.4; }
        }
        :root[data-color-scheme="dark"] {

                background: rgba(15, 23, 42, 0.65);

        }

        }
        :root[data-appearance^="apple-fluid"][data-reduce-transparency="true"] :is(.theme-bg-card, .card-shadow, .liquid-nav, #modal-content) {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: var(--fluid-opaque);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            :root[data-appearance^="apple-fluid"] :is(.theme-bg-card, .card-shadow, .liquid-nav, #modal-content) { background: var(--fluid-opaque); }
        }
        :root[data-appearance^="apple-fluid"] .liquid-nav { max-width: 500px; padding: 3px; border-radius: 30px; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-item { min-height: 62px; border-radius: 26px; gap: 2px; padding: 7px 1px 4px; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-item .material-icons { font-size: 22px; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-item span:last-child { margin-top: 0; font-size: 10px; line-height: 1.2; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-highlight { display: none; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-bg, :root[data-appearance^="apple-fluid"] .liquid-nav-gloss { display: none; }
        :root[data-appearance^="apple-fluid"] .liquid-nav-item.is-active::after { content: ''; background: currentColor; height: 4px; width: 4px; border-radius: 50%; position: absolute; bottom: 2px; }
        /* Hide scrollbar but allow scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theme-bg-card { background-color: var(--bg-card); }
        .theme-text-heading { color: var(--text-heading); }
        .theme-text-sub { color: var(--text-sub); }
        .theme-border { border-color: var(--border-color); }
